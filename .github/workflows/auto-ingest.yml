name: Auto Ingest

on:
  push:
    branches: [main]
    paths:
      - 'links/links.csv'
      - 'links/collections/**'
      - 'ingest.py'

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Run ingest
        run: uv run --no-project python ingest.py

      - name: Commit fetched markdown
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-ingest new links [skip ci]'
          file_pattern: 'raw/**'
