name: Auto Wiki Graph Build

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  build-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Compile knowledge graph
        run: uv run --no-project graphify wiki --no-viz

      - name: Commit compiled graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-compile knowledge graph'
          file_pattern: 'graphify-out/graph.json'

