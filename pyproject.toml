[project]
name = "experience-patterns-oracle"
version = "0.1.0"
description = "Remote UX Pattern Oracle — FastMCP + Graphifyy, self-contained."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastmcp>=2.0",
    "graphifyy>=0.1",
    "requests>=2.32",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anyio>=4.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
]

[tool.ruff]
line-length    = 100
target-version = "py312"
