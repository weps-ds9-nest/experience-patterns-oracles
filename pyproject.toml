[project]
name = "experience-patterns-oracle"
version = "0.1.0"
description = "Remote UX Pattern Oracle — FastMCP + Graphifyy, self-contained."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastmcp>=2.0",
    "requests>=2.32",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anyio>=4.4",
    "graphifyy>=0.8.38",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "watchfiles>=0.21",
]

llm = [
    "openai>=1.0",  # Optional: for LLM backend (set GRAPHIFY_USE_LLM=true to enable)
]

[tool.ruff]
line-length    = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
